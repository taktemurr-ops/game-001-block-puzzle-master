name: Game-001 UAT build gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'assets/**'
      - '.github/workflows/game001-uat.yml'

permissions:
  contents: read

concurrency:
  group: game001-uat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-debug:
    name: Android debug APK and tests
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Runner diagnostics
        run: |
          echo "Runner: ${{ runner.os }} / ${{ runner.arch }}"
          echo "Revision: ${{ github.sha }}"
          df -h .
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android app
        run: flutter create --no-pub --platforms=android --project-name game_001_block_puzzle_master .
      - name: Dependencies
        run: flutter pub get
      - name: Flutter diagnostics
        run: flutter doctor -v
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --reporter expanded
      - name: Android debug APK
        run: flutter build apk --debug
      - name: Verify APK and checksum
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > build/app/outputs/flutter-apk/SHA256SUMS.txt
          cat build/app/outputs/flutter-apk/SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game001-android-debug-uat
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  ios-compile:
    name: iOS unsigned compile
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare iOS
        run: flutter create --no-pub --platforms=ios --project-name game_001_block_puzzle_master .
      - name: Dependencies
        run: flutter pub get
      - name: iOS unsigned compile
        run: flutter build ios --no-codesign
