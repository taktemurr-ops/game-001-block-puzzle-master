name: Game-001 UAT build gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'assets/**'
      - '.github/workflows/game001-uat.yml'
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android and iOS scaffold
        run: flutter create --platforms=android,ios --project-name game_001_block_puzzle_master .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: game001-android-debug-uat
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
  ios-compile:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: iOS scaffold
        run: flutter create --platforms=ios --project-name game_001_block_puzzle_master .
      - run: flutter pub get
      - run: flutter build ios --no-codesign
